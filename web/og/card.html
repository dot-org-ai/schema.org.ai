<!doctype html>
<!--
  The share card for every page of schema.org.ai, as on the Foundation's other sites (foundation.org.ai's
  og/card.html): 1200 x 630, the Foundation's lockup, one headline, at most one line of detail, and the mark at
  poster scale behind them. scripts/og.mjs renders it in headless Chrome: it fills in the font and the mark,
  then calls render() once per card. Two additions for a vocabulary: a term's name may break between the words
  of its CamelCase, and a detail too long for its line is left off rather than cut.
-->
<html lang="en">
<meta charset="utf-8">
<style>
@font-face { font-family: "Public Sans"; src: url("{{FONT}}") format("woff2"); font-weight: 100 900; }
:root { --ground: oklch(0.178 0.006 78); --ink: oklch(0.965 0.005 86); --ink-2: oklch(0.74 0.008 82); --sep: oklch(0.42 0.008 78); --now: oklch(0.80 0.118 68); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ground); }
body { color: var(--ink); font-family: "Public Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; padding: 66px 72px 100px; display: flex; flex-direction: column; }
.logo { color: var(--ink); overflow: visible; flex: none; }
.logo .amber { fill: var(--now); }
/* the mark at poster scale, bleeding off the right edge, quiet behind the words: five ovals faint, the amber one softened */
.giant { position: absolute; width: 860px; height: 860px; right: -190px; top: -110px; }
.giant ellipse { opacity: 0.08; }
.giant ellipse.amber { opacity: 0.6; }
.lock { position: relative; display: flex; align-items: center; gap: 18px; font-size: 42px; font-weight: 620; letter-spacing: -0.012em; line-height: 1; white-space: nowrap; }
.lock .logo { width: 64px; height: 64px; }
.lock .dot { color: var(--now); }
.lock .sep { color: var(--sep); font-weight: 300; margin: 0 2px 0 6px; }
.lock .sub { color: var(--ink-2); font-weight: 420; }
.text { position: relative; margin-top: auto; }
h1 { max-width: 720px; font-weight: 370; letter-spacing: -0.034em; line-height: 1.02; text-wrap: balance; }
.detail { margin-top: 22px; font-size: 40px; line-height: 1.2; color: var(--ink-2); font-weight: 420; letter-spacing: -0.005em; white-space: nowrap; }
.detail b { color: var(--ink); font-weight: 560; }
.nb { white-space: nowrap; }
</style>
<body>
<div class="card" id="card"></div>
<script>
const MARK = {{MARK}};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
// the largest headline, in 2px steps from 92 down to the floor, that stays in its box, on four lines at most
const MAX = 92, MIN = 56, LINES = 4;
window.render = async ({ sub, headline, detailBold, detail, camel }) => {
  const card = document.getElementById("card");
  card.innerHTML =
    MARK.replace('class="logo"', 'class="logo giant"') +
    '<div class="lock">' + MARK + '<span>Org<span class="dot">.</span>AI Foundation</span>' + (sub ? '<span class="sep">/</span><span class="sub">' + esc(sub) + "</span>" : "") + "</div>" +
    // a hyphenated word ("attorney-client", "low-income") is never broken at its hyphen
    '<div class="text"><h1 id="h">' + (camel ? esc(headline).replace(/([a-z0-9])([A-Z])/g, "$1<wbr>$2") : esc(headline).replace(/\S+-\S+/g, (w) => '<span class="nb">' + w + "</span>")) + "</h1>" +
    (detail || detailBold ? '<p class="detail">' + (detailBold ? "<b>" + esc(detailBold) + "</b>" + (detail ? " · " : "") : "") + esc(detail || "") + "</p>" : "") + "</div>";
  await document.fonts.ready;
  const h = document.getElementById("h"), text = h.parentElement, lock = card.querySelector(".lock");
  const bottom = card.getBoundingClientRect().bottom - parseFloat(getComputedStyle(card).paddingBottom);
  const fits = (size) => {
    const lines = Math.round(h.getBoundingClientRect().height / (size * 1.02));
    const d = text.querySelector(".detail");
    return lines <= LINES && text.getBoundingClientRect().bottom <= bottom + 0.5 && h.getBoundingClientRect().top >= lock.getBoundingClientRect().bottom + 28 &&
      h.scrollWidth <= h.clientWidth + 1 && (!d || d.scrollWidth <= text.clientWidth + 1);
  };
  // a detail wider than its line is left off, keeping its bold lead, before the headline is sized
  let detailShown = !!detail;
  const d = text.querySelector(".detail");
  if (d && detail && d.scrollWidth > text.clientWidth + 1) {
    d.innerHTML = detailBold ? "<b>" + esc(detailBold) + "</b>" : "";
    detailShown = false;
  }
  // a title that cannot fit the usual measure at the floor (a few of the longest) gets a wider one
  let size = MAX, width = 720;
  for (width of [720, 880]) {
    h.style.maxWidth = width + "px";
    for (size = MAX; size >= MIN; size -= 2) { h.style.fontSize = size + "px"; if (fits(size)) break; }
    if (size >= MIN) break;
  }
  const ok = size >= MIN && fits(Math.max(size, MIN));
  return { ok, size, width, detailShown, lines: Math.round(h.getBoundingClientRect().height / (Math.max(size, MIN) * 1.02)) };
};
</script>
</body>
</html>
